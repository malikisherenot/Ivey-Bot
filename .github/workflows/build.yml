name: Build Binaries

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
          - name: iOS
            os: macos-latest
            target: iOS
          - name: Android32
            os: ubuntu-latest
            target: Android32
          - name: Android64
            os: ubuntu-latest
            target: Android64

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Pin bindings to the Geode version in mod.json
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(jq -r .geode mod.json)
          git clone --quiet --filter=blob:none https://github.com/geode-sdk/bindings "$RUNNER_TEMP/bindings"
          cd "$RUNNER_TEMP/bindings"
          if git rev-parse -q --verify "refs/tags/v$V" >/dev/null; then
            REF="v$V"
          else
            DATE=$(gh api "repos/geode-sdk/geode/releases/tags/v$V" --jq .published_at)
            REF=$(git rev-list -1 --before="$DATE" origin/HEAD)
          fi
          echo "Bindings $REF for Geode $V"
          git checkout --quiet "$REF"
          echo "GEODE_BINDINGS_REPO_PATH=$PWD" >> "$GITHUB_ENV"

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          target: ${{ matrix.config.target }}

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ["build"]

    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v4
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}
